<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- kartu laporan untuk grid (beranda, cari, barang temuan, dashboard) -->
<a th:fragment="card(l)" class="card" th:href="@{/laporan/{id}(id=${l.idLaporan})}">
  <div class="card__media">
    <img th:src="${l.foto != null ? l.foto.url : ''}" th:alt="'Foto ' + ${l.namaBarang}" loading="lazy" width="400" height="300">
    <div class="card__badges">
      <span class="badge badge--jenis" th:text="${l.jenisLaporan}">Temuan</span>
      <span th:class="'badge badge--' + ${l.status}" th:text="${l.status.label}">Ditemukan</span>
    </div>
  </div>
  <div class="card__body">
    <h3 class="t-h3" th:text="${l.namaBarang}">Nama barang</h3>
    <p class="card__meta">
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span th:text="${l.lokasi}">Lokasi</span></span>
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span th:text="${#temporals.format(l.tanggalKejadian, 'd MMM yyyy')}">1 Okt 2026</span></span>
    </p>
    <p class="t-small" th:text="${l.kategori.label}">Kategori</p>
  </div>
</a>

<!-- baris ringkas untuk daftar di dashboard -->
<a th:fragment="row(l)" class="row" th:href="@{/laporan/{id}(id=${l.idLaporan})}">
  <img th:src="${l.foto != null ? l.foto.url : ''}" alt="" width="56" height="56">
  <span>
    <span class="row__title" th:text="${l.namaBarang}">Nama barang</span><br>
    <span class="row__meta" th:text="${l.jenisLaporan} + ' · ' + ${l.lokasi}">Temuan · Lokasi</span>
  </span>
  <span th:class="'badge badge--' + ${l.status}" th:text="${l.status.label}">Status</span>
</a>

<!-- keadaan kosong -->
<div th:fragment="empty(judul, teks)" class="empty">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5"/></svg>
  <p class="t-h3" th:text="${judul}">Belum ada data</p>
  <p class="t-body muted" th:text="${teks}">Keterangan</p>
</div>

</body>
</html>
