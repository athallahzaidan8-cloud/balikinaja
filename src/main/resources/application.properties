spring.application.name=BalikinAja
# Render (hosting online) memberi port lewat environment variable PORT; di laptop tetap 8080
server.port=${PORT:8080}
# session lewat cookie saja, supaya URL tidak berisi ;jsessionid=...
server.servlet.session.tracking-modes=cookie
# saat online, aplikasi berada di balik proxy HTTPS milik Render
server.forward-headers-strategy=framework

# ---- Database MySQL ----
# Database "balikinaja" dibuat otomatis. Default: MySQL XAMPP di port 3307 (root, tanpa password).
# Yang memakai MySQL di port 3306 cukup ganti 3307 menjadi 3306 (atau isi environment variable DB_PORT),
# lalu isi password lewat DB_PASSWORD atau ganti nilai default-nya di bawah.
# Saat online, alamat database lengkap diisi lewat environment variable DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/balikinaja?createDatabaseIfNotExist=true&serverTimezone=Asia/Jakarta&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# Tabel dibuat/diperbarui otomatis dari kelas entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# ---- Thymeleaf & form ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.format.date=iso

# ---- Upload foto ----
# Batas di sini sengaja lebih besar dari batas aplikasi (10 MB) agar pesan error tetap ramah
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
# lokal = folder uploads/ di laptop; database = disimpan di MySQL (dipakai saat online)
balikinaja.penyimpanan-foto=${PENYIMPANAN_FOTO:lokal}
balikinaja.upload-dir=uploads

# ---- Data contoh & tampilan ----
# Isi data contoh (akun admin, pengguna, dan beberapa laporan) saat database masih kosong
balikinaja.seed-demo=true
# Password akun contoh saat online (kosong = password bawaan untuk di laptop)
balikinaja.admin-password=${ADMIN_PASSWORD:}
balikinaja.demo-password=${DEMO_PASSWORD:}
# Kotak "Akun demo" di halaman login
balikinaja.tampilkan-akun-demo=${TAMPILKAN_AKUN_DEMO:true}
# Buka browser otomatis saat aplikasi siap (hanya berguna di laptop)
balikinaja.buka-browser=${BUKA_BROWSER:true}
# Kode verifikasi Google Search Console (meta tag), diisi setelah situs online
balikinaja.google-site-verification=${GOOGLE_SITE_VERIFICATION:}
